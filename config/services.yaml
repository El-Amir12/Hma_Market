# config/services.yaml

parameters:
    kernel.secret: '%env(APP_SECRET)%'
    app.secret: '%env(APP_SECRET)%'
    
    # Configuration environnement
    app.is_local: false
    
    # Chemins des répertoires
    uploads_directory: '%kernel.project_dir%/public/uploads'
    categories_directory: '%kernel.project_dir%/public/uploads/categories'
    products_directory: '%kernel.project_dir%/public/uploads/products'
    logos_directory: '%kernel.project_dir%/public/uploads/logos'
    photos_directory: '%kernel.project_dir%/public/uploads/photos'
    categories_plats_directory: '%kernel.project_dir%/public/uploads/categories_plats'
    images_plats_directory: '%kernel.project_dir%/public/uploads/images_plats'
    promotions_directory: '%kernel.project_dir%/public/uploads/promotions'
    exports_directory: '%kernel.project_dir%/public/uploads/exports'
    sales_exports_directory: '%kernel.project_dir%/public/uploads/exports/sales'
    sale_receipts_directory: '%kernel.project_dir%/public/uploads/receipts'
    
    # Emails
    app.email_from: 'contact@hma-market.com'
    admin_email: '%env(ADMIN_EMAIL)%'
    support_email: '%env(SUPPORT_EMAIL)%'
    mailer_from_email: '%env(MAILER_FROM_EMAIL)%'
    mailer_from_name: '%env(MAILER_FROM_NAME)%'
    app_name: '%env(APP_NAME)%'
    app_url: '%env(APP_URL)%'
    
    # Répertoires PDF
    bon_commande_directory: '%kernel.project_dir%/public/uploads/bons-commande'
    recu_achat_directory: '%kernel.project_dir%/public/uploads/recus-achat'
    recus_abonnement_directory: '%kernel.project_dir%/public/uploads/recus-abonnement'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            string $logosDirectory: '%logos_directory%'
            string $photosDirectory: '%photos_directory%'
            string $uploadsDirectory: '%uploads_directory%'
            string $categoriesDirectory: '%categories_directory%'
            string $productsDirectory: '%products_directory%'
            string $bonCommandeDirectory: '%bon_commande_directory%'
            string $recuAchatDirectory: '%recu_achat_directory%'
            string $recuAbonnementDirectory: '%recus_abonnement_directory%'
            string $categoriesPlatsDirectory: '%categories_plats_directory%'
            string $imagesPlatsDirectory: '%images_plats_directory%'
            string $promotionsDirectory: '%promotions_directory%'
            string $exportsDirectory: '%exports_directory%'
            string $salesExportsDirectory: '%sales_exports_directory%'
            string $saleReceiptsDirectory: '%sale_receipts_directory%'
            
            string $fromEmail: '%mailer_from_email%'
            string $fromName: '%mailer_from_name%'
            string $appName: '%app_name%'
            string $appUrl: '%app_url%'
            string $adminEmail: '%admin_email%'
            string $supportEmail: '%support_email%'
            string $appEnv: '%kernel.environment%'

    # ==================== CHARGEMENT AUTOMATIQUE DES SERVICES ====================
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'

    # ==================== CONTROLEURS ====================
    # Le chargement automatique des contrôleurs ne doit pas inclure la classe abstraite
    App\Controller\:
        resource: '../src/Controller/'
        exclude:
            - '../src/Controller/Sale/BaseSaleController.php'  # Exclure la classe abstraite
        tags: ['controller.service_arguments']

    # ==================== EXTENSIONS TWIG ====================
    App\Twig\FcfaExtension:
        tags: ['twig.extension']
        public: false

    App\Twig\AppExtension:
        tags: ['twig.extension']
        public: false

    App\Twig\ColorExtension:
        tags: ['twig.extension']

    App\Twig\CompanyExtension:
        tags: ['twig.extension']

    # ==================== SERVICES PDF ====================
    Dompdf\Dompdf:
        public: false

    # ==================== SERVICES D'ABONNEMENT ====================
    App\Service\SubscriptionNumberGenerator:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'

    # ==================== SERVICES EMAIL ET NOTIFICATION ====================
    App\Service\EmailService:
        arguments:
            $mailer: '@mailer.mailer'
            $logger: '@monolog.logger'
            $urlGenerator: '@router.default'
        public: true

    App\Service\NotificationService:
        arguments:
            $mailer: '@mailer.mailer'
            $twig: '@twig'
            $logger: '@monolog.logger'
            $appEmail: '%mailer_from_email%'
            $appUrl: '%app_url%'
            $isLocal: '%app.is_local%' 
        public: true

    # ==================== SERVICES DE GESTION ====================
    App\Service\StockService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $logger: '@monolog.logger'
        public: true

    App\Service\ProductSearchService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
        public: true

    App\Service\FileUploader:
        arguments:
            $targetDirectory: '%logos_directory%'
            $slugger: '@Symfony\Component\String\Slugger\SluggerInterface'
        public: false

    # ==================== SERVICE DE SUPPRESSION COMPLET ====================
    App\Service\CompanyDeletionService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $filesystem: '@filesystem'
            $logger: '@logger'
            $logosDirectory: '%logos_directory%'
            $photosDirectory: '%photos_directory%'
            $productsDirectory: '%products_directory%'
            $categoriesDirectory: '%categories_directory%'
            $uploadsDirectory: '%uploads_directory%'
            $categoriesPlatsDirectory: '%categories_plats_directory%'
            $imagesPlatsDirectory: '%images_plats_directory%'
            $promotionsDirectory: '%promotions_directory%'
            $bonCommandeDirectory: '%bon_commande_directory%'
            $recuAchatDirectory: '%recu_achat_directory%'
            $recuAbonnementDirectory: '%recus_abonnement_directory%'
            $exportsDirectory: '%exports_directory%'
            $salesExportsDirectory: '%sales_exports_directory%'
            $saleReceiptsDirectory: '%sale_receipts_directory%'

    App\Service\FedaPayService:
        arguments:
            $apiKey: '%env(FEDAPAY_API_KEY)%'
            $environment: '%env(FEDAPAY_ENVIRONMENT)%'

    App\Service\UnitConverter:
        public: false

    App\Service\MenuBuilder:
        arguments:
            $security: '@security.helper'
        public: true

    App\Service\InvoicePdfGenerator:
        arguments:
            $twig: '@twig'
            $pdfDirectory: '%recus_abonnement_directory%'
            $bonCommandeDirectory: '%bon_commande_directory%'
            $recuAchatDirectory: '%recu_achat_directory%'
            $logger: '@monolog.logger'
            $entityManager: '@doctrine.orm.entity_manager'

    # ==================== SERVICES DE VENTE ====================
    App\Service\Sale\PromotionCalculator:
        arguments:
            $promotionRepository: '@App\Repository\PromotionRepository'
            $logger: '@monolog.logger'
        public: true

    App\Service\Sale\StockDeductionService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $stockBatchRepository: '@App\Repository\StockBatchRepository'
            $logger: '@monolog.logger'
        public: true

    App\Service\Sale\SaleService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $stockDeductionService: '@App\Service\Sale\StockDeductionService'
            $promotionCalculator: '@App\Service\Sale\PromotionCalculator'
            $unitConverter: '@App\Service\UnitConverter'
            $stockSyncService: '@App\Service\StockSyncService'
            $productRepository: '@App\Repository\ProductRepository'
            $recipeRepository: '@App\Repository\RecipeRepository'
            $logger: '@monolog.logger'
            $requestStack: '@request_stack'
        public: true

    App\Service\Sale\ReceiptGenerator:
        arguments:
            $twig: '@twig'
            $dompdf: '@Dompdf\Dompdf'
            $logger: '@monolog.logger'
            $receiptsDirectory: '%sale_receipts_directory%'
        public: true

    # ==================== SERVICES D'EXPORT ====================
    App\Service\Export\SaleExportService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $orderRepository: '@App\Repository\OrderRepository'
            $salesExportsDirectory: '%sales_exports_directory%'  # ← Changé de $exportDirectory à $salesExportsDirectory
        public: true

    # ==================== SERVICES DE GESTION DES STOCKS ====================
    App\Service\Stock\StockAdjustmentService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $stockMovementService: '@App\Service\StockMovementService'
            $notificationService: '@App\Service\NotificationService'
            $fileUploader: '@App\Service\FileUploader'
            $adjustmentRepository: '@App\Repository\StockAdjustmentRepository'
        public: true

    App\Service\Stock\StockInventoryService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $stockMovementService: '@App\Service\StockMovementService'
            $notificationService: '@App\Service\NotificationService'
            $logger: '@monolog.logger'
            $stockBatchRepository: '@App\Repository\StockBatchRepository'
            $productRepository: '@App\Repository\ProductRepository'
        public: true

    App\Service\Stock\StockTransferService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $stockMovementService: '@App\Service\StockMovementService'
            $notificationService: '@App\Service\NotificationService'
            $logger: '@monolog.logger'
            $stockBatchRepository: '@App\Repository\StockBatchRepository'
            $locationRepository: '@App\Repository\LocationRepository'
        public: true

    # ==================== DÉJÀ EXISTANT - À GARDER ====================
    App\Service\StockMovementService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $logger: '@monolog.logger'
        public: true

    # ==================== SÉCURITÉ ET ÉVÉNEMENTS ====================
    App\Security\LoginSuccessHandler:
        arguments:
            $urlGenerator: '@router'
            $requestStack: '@request_stack'
            $entityManager: '@doctrine.orm.entity_manager'
            $passwordHasher: '@security.user_password_hasher'
            $subscriptionGenerator: '@App\Service\SubscriptionNumberGenerator'
            $emailService: '@App\Service\EmailService'
        public: true

    App\EventSubscriber\UserDisabledSubscriber:
        tags:
            - { name: kernel.event_subscriber }

    App\EventListener\LoginListener:
        tags:
            - { name: kernel.event_subscriber }

    App\EventListener\LogoutListener:
        tags:
            - { name: kernel.event_subscriber }

    App\EventListener\ActivityListener:
        tags:
            - { name: kernel.event_subscriber }

    App\Service\UniqueNameValidator:
        autowire: true
        autoconfigure: true

    App\Service\Return\ReturnService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $returnOrderRepository: '@App\Repository\ReturnOrderRepository'
            $stockBatchRepository: '@App\Repository\StockBatchRepository'
            $stockSyncService: '@App\Service\StockSyncService'
            $logger: '@monolog.logger'
        public: true

    # ==================== SERVICE DE SYNCHRONISATION STOCK ====================
    App\Service\StockSyncService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $stockBatchRepository: '@App\Repository\StockBatchRepository'
            $logger: '@monolog.logger'
        public: true

    App\Service\SupplierCreditNoteService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $logger: '@monolog.logger'
            $mailer: '@mailer.mailer'
            $twig: '@twig'
            $urlGenerator: '@router.default'
            $slugger: '@Symfony\Component\String\Slugger\SluggerInterface'
            $supportEmail: '%support_email%'
        public: true

    # ==================== SERVICES DE RAPPORTS ====================
    App\Service\Report\FinancialCalculatorService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $paymentRepository: '@App\Repository\PaymentRepository'
            $subscriptionRepository: '@App\Repository\SubscriptionRepository'
            $logger: '@monolog.logger'
        public: true

    App\Service\Report\SalesReportService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
        public: true

    App\Service\Report\StockReportService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
        public: true


    # ==================== SERVICES SUPER ADMIN ====================
    App\Service\SuperAdmin\CompanyAnalysisExportService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $orderRepository: '@App\Repository\OrderRepository'
            $purchaseRepository: '@App\Repository\PurchaseRepository'
            $stockBatchRepository: '@App\Repository\StockBatchRepository'
            $stockMovementRepository: '@App\Repository\StockMovementRepository'
            $productRepository: '@App\Repository\ProductRepository'
            $userRepository: '@App\Repository\UserRepository'
            $supplierRepository: '@App\Repository\SupplierRepository'
            $categoryRepository: '@App\Repository\CategoryRepository'
            $recipeRepository: '@App\Repository\RecipeRepository'
            $returnOrderRepository: '@App\Repository\ReturnOrderRepository'
            $supplierCreditNoteRepository: '@App\Repository\SupplierCreditNoteRepository'
            $notificationService: '@App\Service\NotificationService'
            $logger: '@monolog.logger'
            $exportsDirectory: '%exports_directory%'
        public: true

    # ==================== SERVICES DE PAIEMENT POUR ANALYSES ====================
    App\Service\Payment\SubscriptionPaymentService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $fedaPayService: '@App\Service\FedaPayService'
            $notificationService: '@App\Service\NotificationService'
            $logger: '@monolog.logger'
        public: true

    # ==================== REPOSITORIES ====================
    App\Repository\AnalysisPriceRepository:
        arguments:
            $registry: '@doctrine'
        public: true

    App\Repository\AnalysisRequestRepository:
        arguments:
            $registry: '@doctrine'
        public: true

    App\Repository\AnalysisPaymentRepository:
        arguments:
            $registry: '@doctrine'
        public: true

    # ==================== COMMANDES CRON ====================
    App\Command\CreateMonthlySubscriptionsCommand:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $analysisRepository: '@App\Repository\AnalysisRequestRepository'
        tags:
            - { name: console.command }

    App\Command\SendSubscriptionRemindersCommand:
        arguments:
            $analysisRepository: '@App\Repository\AnalysisRequestRepository'
            $notificationService: '@App\Service\NotificationService'
            $entityManager: '@doctrine.orm.entity_manager'
        tags:
            - { name: console.command }

    App\Command\CleanExpiredAnalysisCommand:
        arguments:
            $repository: '@App\Repository\AnalysisRequestRepository'
            $entityManager: '@doctrine.orm.entity_manager'
        tags:
            - { name: console.command }

    # ==================== FORMULAIRES ====================
    App\Form\AnalysisRequestType:
        arguments:
            $priceRepository: '@App\Repository\AnalysisPriceRepository'
        tags:
            - { name: form.type }

    App\Form\AnalysisPriceType:
        tags:
            - { name: form.type }

    # ==================== CONTROLEURS ENTREPRISE (ANALYSES) ====================
    App\Controller\Company\CompanyAnalysisController:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $logger: '@monolog.logger'
        tags:
            - { name: controller.service_arguments }

    # ==================== CONTROLEURS SUPER ADMIN (ANALYSES) ====================
    App\Controller\SuperAdmin\CompanyAnalysisController:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
            $logger: '@monolog.logger'
        tags:
            - { name: controller.service_arguments }

    App\Service\ProxyInitializerService:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'
        public: true
            
