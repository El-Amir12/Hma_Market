# config/packages/security.yaml
security:
    enable_authenticator_manager: true
    
    # Configuration des encodeurs de mot de passe
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\HmaService:
            algorithm: auto
        App\Entity\User:
            algorithm: auto

    # Fournisseurs d'utilisateurs
    providers:
        user_provider:
            entity:
                class: App\Entity\User
                property: email
        
        hma_service_provider:
            entity:
                class: App\Entity\HmaService
                property: email
        
        chain_provider:
            chain:
                providers: ['user_provider', 'hma_service_provider']

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: chain_provider
            user_checker: App\Security\UserChecker
            
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                require_previous_session: false
                default_target_path: app_home
                always_use_default_target_path: false
                use_referer: false
                success_handler: App\Security\LoginSuccessHandler
            
            logout:
                path: app_logout
                target: app_login
                invalidate_session: true
            
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: false
                remember_me_parameter: '_remember_me'

    access_control:
        # ✅ CORRECTION: Ajouter check-email et toutes les routes de reset en PUBLIC_ACCESS
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        - { path: ^/first-login, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/check-email, roles: PUBLIC_ACCESS }  # <-- AJOUT ESSENTIEL
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/contact$, roles: PUBLIC_ACCESS }
        - { path: ^/about$, roles: PUBLIC_ACCESS }
        - { path: ^/features$, roles: PUBLIC_ACCESS }
        - { path: ^/pricing$, roles: PUBLIC_ACCESS }
        
        - { path: ^/api/public/, roles: PUBLIC_ACCESS }
        - { path: ^/uploads/, roles: PUBLIC_ACCESS }
        - { path: ^/build/, roles: PUBLIC_ACCESS }
        
        - { path: ^/admin/super, roles: ROLE_SUPER_ADMIN }
        - { path: ^/admin/, roles: ROLE_ADMIN }
        - { path: ^/manager/, roles: ROLE_MANAGER }
        - { path: ^/stock/, roles: ROLE_STOCK_MANAGER }
        - { path: ^/cashier/, roles: ROLE_CASHIER }
        
        - { path: ^/dashboard, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/profile, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/change-password, roles: IS_AUTHENTICATED_FULLY }
        
        # ✅ IMPORTANT: Mettre cette règle APRÈS toutes les routes publiques
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }