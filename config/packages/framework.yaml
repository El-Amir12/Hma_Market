# config/packages/framework.yaml
framework:
    secret: '%env(APP_SECRET)%'

    # ============================================
    # Configuration pour reverse proxy (Vercel)
    # Indispensable pour éviter les boucles de redirection HTTPS
    # ============================================
    trusted_proxies: 'private_ranges'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    serializer:
        enabled: true
    property_info:
        enabled: true
    
    # Désactiver CSRF au niveau framework
    csrf_protection:
        enabled: true
    
    # Configuration sessions (garder simple)
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        name: HMASESSID
    
    php_errors:
        log: true